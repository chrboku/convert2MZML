[project]
name = "convert2RAW"
version = "4.0.0"
description = "Convert Thermo raw files and correct incorrect MSMS precursor information."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4",
    "lxml",
    "toml>=0.10.2",
    "textual>=0.70.0",
]

[project.scripts]
convert2raw = "convert2raw.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/convert2raw"]

[tool.ruff]
line-length = 180
